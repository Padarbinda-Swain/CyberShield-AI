<!doctype html><meta charset="utf-8">
<style>
 body{width:320px;margin:0;padding:18px;background:#06121A;color:#E8F3F7;font:14px/1.5 system-ui,sans-serif}
 h1{font-size:17px;margin:0 0 12px;color:#4CC9F0} input{width:100%;box-sizing:border-box;margin:5px 0 10px;padding:9px 11px;border-radius:9px;border:1px solid #1F3B4C;background:#0A1A24;color:#fff}
 button{width:100%;padding:10px;border:0;border-radius:99px;background:#4CC9F0;color:#04202B;font-weight:700;cursor:pointer}
 .score{font:800 46px/1 system-ui;margin:6px 0}.mute{color:#8AA7B7;font-size:12.5px}.row{display:flex;justify-content:space-between;align-items:center}
 ul{padding-left:18px;margin:8px 0}a{color:#4CC9F0;cursor:pointer} label.sw{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px}label.sw input{width:auto;margin:0}
</style>
<h1>CyberShield AI</h1>
<div id="login" hidden>
  <div class="mute">Sign in with your CyberShield account to check sites as you browse.</div>
  <input id="api" placeholder="API address" /><input id="email" type="email" placeholder="Email" /><input id="pw" type="password" placeholder="Password" />
  <button id="go">Sign in</button><div id="err" class="mute" style="color:#FF8A8E;margin-top:8px"></div>
</div>
<div id="main" hidden>
  <div class="mute" id="url" style="word-break:break-all"></div><div class="score" id="score">…</div><div id="verdict"></div><ul id="why"></ul>
  <label class="sw"><input type="checkbox" id="en"> Warn me on dangerous sites</label>
  <div class="mute" style="margin-top:12px"><a id="out">Sign out</a></div>
</div>
<script src="popup.js"></script>
