# Local/prod-like stack:  docker compose up --build   ->  http://localhost:8080
# Add `--profile mongo` to run a local MongoDB instead of Atlas.
services:
  backend:
    build: { context: ., dockerfile: docker/Dockerfile.backend }
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
    volumes: ["cs_data:/app/data"]
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: docker/Dockerfile.frontend }
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
volumes: { cs_data: {}, mongo_data: {} }
